{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card shadow-lg p-4 border-0">

            <h3 class="mb-4 text-center">🔍 Verify Your Vote</h3>

            <form method="POST">

                <input type="text"
                       name="receipt"
                       class="form-control"
                       placeholder="Enter your receipt ID"
                       required>

                <div class="text-center mt-3">
                    <button class="btn btn-success px-4">Verify</button>
                </div>

            </form>

            {% if result %}

                <div class="alert alert-info mt-4">

                    <strong>Status:</strong> {{ result.status }} <br>
                    <strong>Message:</strong> {{ result.message }}

                </div>

                {% if result.status == "FOUND" %}

                    <div class="text-center">

                        <form method="POST" action="/download/{{ result.receipt }}">

                            <div class="mt-3">

                                <select name="language" class="form-select mb-2">
                                    <option value="en">English</option>
                                    <option value="hi">Hindi</option>
                                    <option value="ta">Tamil</option>
                                    <option value="te">Telugu</option>
                                    <option value="ml">Malayalam</option>
                                </select>

                                <button class="btn btn-dark">
                                    ⬇ Download Receipt PDF
                                </button>

                            </div>

                        </form>

                    </div>

                {% endif %}

            {% endif %}

        </div>

    </div>

</div>

{% endblock %}
